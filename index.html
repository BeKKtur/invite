<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Приглашение на свадьбу</title>

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
</head>

<body>

  <main class="invitation">

    <!-- Молодожёны на фоне -->
    <div class="couple"></div>

    <!-- Затемнение изображения -->
    <div class="overlay"></div>

    <!-- Цветы -->
    <div class="flowers flowers-left">🌿</div>
    <div class="flowers flowers-right">🌿</div>

    <section class="content">

      <p class="small-title">Мы будем счастливы разделить с вами</p>

      <h1>
        День<br>
        нашей свадьбы
      </h1>

      <div class="names">
        <span>Name - Имя</span>
        <span class="amp">&</span>
        <span>Name - Имя</span>
      </div>

      <div class="line"></div>

      <p class="text">
        Приглашаем вас разделить с нами
        этот особенный и счастливый день.
      </p>

      <div class="details">

        <div class="detail">
          <span class="icon">♡</span>
          <div>
            <small>Дата</small>
            <strong>20 ИЮНЯ 2027</strong>
          </div>
        </div>

        <div class="detail">
          <span class="icon">⌖</span>
          <div>
            <small>Место</small>
            <strong>Ресторан «Жемчуг»</strong>
            <span>ул. Киевская, 100</span>
          </div>
        </div>

        <div class="detail">
          <span class="icon">◷</span>
          <div>
            <small>Начало</small>
            <strong>18:00</strong>
          </div>
        </div>

      </div>
      <p class="bottom-text">
        Будем ждать вас!
      </p>

    </section>

  </main>

</body>
</html>
